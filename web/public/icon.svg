<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OMP Pulse">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22222c"/>
      <stop offset="1" stop-color="#141519"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d86ff"/>
      <stop offset="1" stop-color="#6e56e7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#field)"/>
  <rect x="1" y="1" width="510" height="510" rx="113" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>

  <!-- A pulse traced through the terminal prompt: the app is a heartbeat from
       a running session, not a generic console. -->
  <path d="M96 268 H171 L199 196 L241 320 L279 246 L300 268 H416"
        fill="none" stroke="url(#mark)" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="416" cy="268" r="21" fill="#9d86ff" filter="url(#glow)"/>
</svg>
