# Release signing — keep secrets OUT of the repo.
# The release keystore is NOT committed. Create it once and store in ~/.gradle/gradle.properties:
#
#   # Generate (once):
#   #   keytool -genkeypair -v -keystore ~/.gradle/omp-pulse-release.keystore \
#   #     -alias omppulse -keyalg RSA -keysize 2048 -validity 10000
#   #
#   # Then add to ~/.gradle/gradle.properties (NOT this file):
#   #   ompPulseStoreFile=/home/<you>/.gradle/omp-pulse-release.keystore
#   #   ompPulseStorePassword=<store-pass>
#   #   ompPulseKeyAlias=omppulse
#   #   ompPulseKeyPassword=<key-pass>
#   #
#   # Or use env vars: OMP_PULSE_KEYSTORE, OMP_PULSE_STORE_PASSWORD,
#   #   OMP_PULSE_KEY_ALIAS, OMP_PULSE_KEY_PASSWORD
#   # If none are set, `assembleRelease` fails with a clear GradleException
#   # rather than silently falling back to the debug key (which would block updates).

# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with
# the Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# INVARIANT: R8 fullMode enables deeper shrinking (required for resource shrinking
# to reach target size). Keep rules in proguard-rules.pro are written for fullMode.
android.enableR8.fullMode=true
# INVARIANT: Non-transitive R class reduces DEX size; matches modern AGP default.
android.nonTransitiveRClass=true
